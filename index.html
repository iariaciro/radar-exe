<script>function score(p){
  let s=0,w=[];
  if(p.e==="solo"){s+=30;w.push("Edita solo")}else if(p.e==="nose"){s+=15;w.push("Equipo incierto")}else if(p.e==="pro"){w.push("Es del rubro: difícil")}else{s+=2}
  s+=(5-p.q)*5; if(p.q<=2)w.push("Edición mejorable");
  s+={irr:15,sem:12,dia:5,rara:8}[p.fr]; if(p.fr==="irr"||p.fr==="rara")w.push("Publica poco");
  if(p.l==1){s+=15;w.push("Contenido largo")}
  if(p.m==1){s+=10;w.push("Monetiza")}
  const f=p.f; s+= f>=5000&&f<=100000?10: f>=1000&&f<5000?5: f>100000?4:2;
  if(f>=5000&&f<=100000)w.push("Tamaño ideal");
  s+={alto:10,med:5,bajo:2}[p.g]; if(p.g==="alto")w.push("Buen engagement");
  let v=Math.min(100,Math.round(s/110*100));
  if(p.e==="pro")v=Math.round(v*0.35);
  return {s:v,w};
}
function firstName(p){
  const norm=x=>x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const cap=x=>x[0].toUpperCase()+x.slice(1).toLowerCase();
  const u=norm(p.u.replace("@","")).replace(/[^a-z]/g,"");
  const skip=/^(dr|dra|lic|prof|mg|ing|arq|the|la|el|los|las|de|del|estudio|studio|agencia|grupo|centro|clinica|tienda|shop|team|equipo|oficial|official|consultora|academia|nutri|coach|fit|gym|club|mundo|casa|hola|legal|abogados|abogada|abogado|salud|marketing|negocios|inmobiliaria|belleza|moda|deco|estetica|fotografia|diseno|coaching|terapia|nutricion|comunicacion|digital|online|studios|ar)$/;
  for(const t of (p.dn||"").split(/\s+/)){
    const c=t.replace(/[^\p{L}]/gu,"");
    const k=norm(c);
    if(c.length>=3&&!skip.test(k)&&u.includes(k))return cap(c);
  }
  const h=p.u.replace("@","").split(/[._\d]/)[0];
  return /^[a-z]{3,8}$/i.test(h)&&!skip.test(norm(h))?cap(h):"";
}
function guessPlural(o){

  const name=nr(o.name),user=nr(String(o.user||"").replace("@","")),bio=nr(o.bio),cat=nr(o.cat);
  let P=0,S=0;const wp=[],ws=[];
  const hit=(re,s)=>{const m=s.match(re);return m?m[0].trim():null};
  let m;
  if(m=hit(/empresa|marca|tienda|agencia|restaurante|negocio|organizacion|productora|club|equipo|grupo|centro|clinica|consultora|academia|institucion|medio de comunicacion|comercio|inmobiliaria|gimnasio|estudio|sitio web/,cat)){P+=3;wp.push("categoría «"+m+"»")}
  else if(m=hit(/persona|figura publica|creador|creadora|blog personal|escritor|escritora|coach|entrenador|entrenadora|periodista|influencer|modelo|fotografo|fotografa|disenador|disenadora|chef|doctor|doctora|psicolog|abogad|nutricionista|profesor|profesora|atleta|deportista|actor|actriz|cantante/,cat)){S+=2;ws.push("categoría «"+m+"»")}
  if(m=hit(/\b(equipo|team|studio|estudio|agencia|agency|productora|colectivo|grupo|club|academia|clinica|centro|consultora|inmobiliaria|company|hermanos|familia|duo|trio|pareja|crew|laboratorio)\b/,name)){P+=3;wp.push("«"+m+"» en el nombre")}
  else if(m=hit(/(team|equipo|studio|estudio|agencia|agency|productora|colectivo|grupo|club|academia|clinica|consultora|inmobiliaria|crew|hermanos|familia)/,user)){P+=2;wp.push("«"+m+"» en el usuario")}
  if(/^[a-z]+ (y|e|&|\+) [a-z]+/.test(name)){P+=2;wp.push("dos nombres juntos")}
  if(/^(los|las) /.test(name)){P+=2;wp.push("nombre en plural")}
  if(/^(dr|dra|lic|prof|mg|ing|arq|cdor|cdora)\.? /.test(name)){S+=3;ws.push("título personal")}
  if(m=hit(/\b(somos|nosotros|nosotras|nuestro|nuestra|nuestros|nuestras|ayudamos|trabajamos|hacemos|creamos|acompanamos|ofrecemos|brindamos|tenemos|juntos)\b/,bio)){P+=3;wp.push("«"+m+"» en la bio")}
  if(m=hit(/\b(soy|yo|ayudo|hago|creo|acompano|ofrezco|me dedico|fundador|fundadora|mama|papa|madre|padre|esposa|esposo|casado|casada|mi trabajo|mis clases)\b/,bio)){S+=2;ws.push("«"+m+"» en la bio")}
  const pl=(P>=3&&P>S)?"p":"s";
  return {pl,P,S,why:pl==="p"?"Grupo ("+wp.join(", ")+")":"Persona"+(ws.length?" ("+ws.join(", ")+")":" (sin pistas de grupo)")};
}

            :`che${sp}, si querés subir más seguido sin que te lleve tiempo, yo edito reels para creadores. te mando ejemplos si querés`);

  save();head();toast(count?"Copiado y contado ✓":"Copiado ✓");

function copyGancho(count){
  const t=$("#go").value.trim();if(!t)return;

    LOGC().push(Date.now());

}

/* ---------- Sincronización (repo privado de GitHub) ---------- */
const CFGK="radar_sync_cfg",BASEK="radar_sync_base";
const getCfg=()=>{try{return JSON.parse(localStorage.getItem(CFGK)||"null")}catch(e){return null}};
let syncTimer=null,syncing=false,SS={t:0,ok:true,msg:""};
function schedSync(){if(!getCfg())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>runSync(),6000)}
const syncA={
  read:async()=>({prospects:ST.prospects,log:ST.log,logA:ST.logA,limit:ST.limit,hlimit:ST.hlimit,limitA:ST.limitA,hlimitA:ST.hlimitA,setAt:ST.setAt||0}),
  write:async m=>{ST.prospects=m.prospects;ST.log=m.log;ST.logA=m.logA||[];if(m.limit!=null)ST.limit=m.limit;if(m.hlimit!=null)ST.hlimit=m.hlimit;if(m.limitA!=null)ST.limitA=m.limitA;if(m.hlimitA!=null)ST.hlimitA=m.hlimitA;ST.setAt=m.setAt;save(true)},
  getCfg:async()=>getCfg(),
  getBase:async()=>{try{return JSON.parse(localStorage.getItem(BASEK)||"null")}catch(e){return null}},
  setBase:async b=>{try{localStorage.setItem(BASEK,JSON.stringify(b))}catch(e){}}
};
function setSst(t){const e=$("#sst");if(!e)return;e.textContent=t||(getCfg()?(SS.t?(SS.ok?"✓ ":"⚠️ ")+SS.msg+" · "+new Date(SS.t).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}):"Configurado"):"Sin configurar")}
async function runSync(manual){
  if(syncing||!getCfg())return;
  syncing=true;setSst("Sincronizando…");
  const r=await RadarSync.run(syncA);
  SS={t:Date.now(),ok:r.ok,msg:r.msg};syncing=false;
  head();setSst();
  const ae=document.activeElement&&document.activeElement.tagName;
  if(r.pulled&&(view==="cola"||view==="list")&&ae!=="TEXTAREA"&&ae!=="INPUT"&&ae!=="SELECT")render();
  if(r.retry)setTimeout(()=>runSync(),4000);
  if(manual)toast(r.ok?"Sincronizado ✓":"Error: "+r.msg);
}

/* ---------- Eventos ---------- */
function openChat(u){window.open(chatURL(u),"_blank")}
$("#v").addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,u=b.dataset.u,p=u&&find(u);
  if(a==="open"&&p){if(!limitsOK())return;copy($("#ms").value);p.st="cont";p.sent=Date.now();p.fu=Date.now()+3*DAY;if(!p.via)p.via=isA()?"a":"p";LOGC().push(Date.now());save();head();openChat(p.u);render()}
  if(a==="fu"){const q=due()[0];if(!q||!limitsOK())return;copy(msgs(q).f);q.fud=Date.now();LOGC().push(Date.now());save();head();openChat(q.u);render()}
  if(a==="skip"&&p){p.skip=Date.now();save();render()}
  if(a==="disc"&&p){p.st="desc";save();render()}
  if(a==="rm"&&p&&confirm("¿Borrar "+p.u+"?")){ST.prospects=ST.prospects.filter(x=>x!==p);save();render()}
  if(a==="toresp"){RS={u,v:0,ge:false};setView("resp")}
  if(a==="edit"){editU=u;setView("mas")}
  if(a==="cancel"){editU=null;render()}
  if(a==="saveform")saveForm();
  if(a==="plus"){LOGC().push(Date.now());save();head();toast("+1")}
  if(a==="minus"){const l=LOGC();l.sort((x,y)=>x-y);l.pop();save();head();toast("−1")}
  if(a==="sy_save"){
    const repo=$("#s_repo").value.trim(),old=getCfg(),token=$("#s_tok").value.trim()||(old&&old.token)||"";
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return alert("Formato del repo: usuario/nombre");
    if(!token)return alert("Falta el token");
    try{localStorage.setItem(CFGK,JSON.stringify({repo,token}));localStorage.removeItem(BASEK)}catch(err){return alert("No pude guardar la configuración")}
    $("#s_tok").value="";runSync(true);
  }
  if(a==="sy_now")runSync(true);
  if(a==="sy_off"&&confirm("¿Desconectar la sincronización? Tus datos quedan en este teléfono.")){try{localStorage.removeItem(CFGK);localStorage.removeItem(BASEK)}catch(err){}render()}
  if(a==="export"){copy(JSON.stringify(ST.prospects));toast("Backup copiado ✓")}
  if(a==="merge")doImport(false);
  if(a==="replace")doImport(true);
  if(a==="paste"){try{$("#rm").value=await navigator.clipboard.readText();RS.v=0;refreshResp()}catch(err){toast("Pegalo a mano en el cuadro")}}
  if(a==="rnx"){RS.v++;refreshResp()}
  if(a==="rcc")doReplyCopy(true);
  if(a==="rc0")doReplyCopy(false);
  if(a==="gcc")copyGancho(true);
  if(a==="gc0")copyGancho(false);
  if(a==="bk"){const r=replies(curP())[+b.dataset.i];if(r){$("#ro").value=r.t;$("#rnote").textContent=BRK.test(r.t)?"Completá lo que está entre [corchetes] antes de enviar.":"";$("#ro").scrollIntoView({block:"nearest"})}}
});
$("#v").addEventListener("input",e=>{if(e.target.id==="rm"){RS.v=0;refreshResp()}if(e.target.id==="go")RS.ge=true});
$("#v").addEventListener("change",e=>{
  const t=e.target,c=t.dataset.c,p=t.dataset.u&&find(t.dataset.u);
  if(t.id==="rp"){RS.u=t.value;RS.v=0;RS.ge=false;if(!t.value)delete DUMMY.pl;refreshResp()}
  if(t.id==="gk"){RS.ge=false;fillGancho(true)}
  if(t.id==="rpl"){const q=curP();if(t.value)q.pl=t.value;else delete q.pl;if(q!==DUMMY)save();RS.ge=false;refreshResp()}
  if(c==="flt"){filt=t.value;render()}

  if(c==="pl"&&p){if(t.value)p.pl=t.value;else delete p.pl;save();render()}
  if(c==="lim"){if(isA())ST.limitA=Math.max(1,+t.value||10);else ST.limit=Math.max(1,+t.value||25);ST.setAt=Date.now();save();head()}
  if(c==="hlim"){if(isA())ST.hlimitA=Math.max(1,+t.value||3);else ST.hlimit=Math.max(1,+t.value||6);ST.setAt=Date.now();save();head()}
});
function render(){head();({cola:vCola,resp:vResp,list:vList,mas:vMas})[view]();document.querySelectorAll("#nv button").forEach(b=>b.classList.toggle("on",b.dataset.n===view))}
function setView(v){view=v;if(v!=="mas")editU=null;render();scrollTo(0,0)}
$("#nv").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setView(b.dataset.n)});
$("#hd").addEventListener("click",e=>{
  const b=e.target.closest("[data-acc]");if(!b||b.dataset.acc===ACC)return;
  ACC=b.dataset.acc;try{localStorage.setItem(ACCK,ACC)}catch(err){}
  setAcctG();RS.ge=false;render();toast(isA()?"Cuenta: Agencia":"Cuenta: Personal");
});
load();render();setInterval(head,30000);
if(getCfg())runSync();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&getCfg())runSync()});
setInterval(()=>{if(!document.hidden&&getCfg())runSync()},90000);
</script></body></html>
